name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun (bun-v1.2.21)
        run: |
          curl -fsSL -o bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.2.21/bun-linux-x64.zip
          unzip -q bun.zip
          echo "$PWD/bun-linux-x64" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun (bun-v1.2.21)
        run: |
          curl -fsSL -o bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.2.21/bun-linux-x64.zip
          unzip -q bun.zip
          echo "$PWD/bun-linux-x64" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun (bun-v1.2.21)
        run: |
          curl -fsSL -o bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.2.21/bun-linux-x64.zip
          unzip -q bun.zip
          echo "$PWD/bun-linux-x64" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
        env:
          DATABASE_URL: postgresql://localhost:5432/supercode
        continue-on-error: true
      - run: bun test
